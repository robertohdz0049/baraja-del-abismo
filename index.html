<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Abismo — Juegos en pareja</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0e0c;
        --surface: #1a1916;
        --surface2: #242320;
        --surface3: #2e2c28;
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.15);
        --text: #f0ece4;
        --text2: #9a9589;
        --text3: #5a564f;
        --spades: #c8c0b0;
        --hearts: #d4574a;
        --diamonds: #d4884a;
        --clubs: #6db87a;
        --gold: #c9a84c;
        --gold2: #8a6f30;
        --p1: #7bb8f0;
        --p2: #d080d0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1.5rem;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 30% 20%,
            rgba(201, 168, 76, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 70% 80%,
            rgba(212, 87, 74, 0.04) 0%,
            transparent 50%
          );
        pointer-events: none;
      }
      .app {
        width: 100%;
        max-width: 520px;
        position: relative;
        z-index: 1;
        padding-bottom: 3rem;
      }
      .logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .logo-suit {
        font-size: 13px;
        letter-spacing: 0.3em;
        color: var(--gold2);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      .logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 34px;
        font-weight: 400;
        line-height: 1.1;
      }
      .logo h1 em {
        font-style: italic;
        color: var(--gold);
      }
      .logo-sub {
        font-size: 12px;
        color: var(--text3);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 0.5rem;
      }
      .card-bg {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem;
      }
      .btn {
        padding: 11px 18px;
        border-radius: 10px;
        border: 0.5px solid var(--border2);
        background: transparent;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn:hover {
        background: var(--surface2);
      }
      .btn-primary {
        background: var(--gold2);
        border-color: var(--gold2);
        color: #f0ece4;
        font-weight: 500;
      }
      .btn-primary:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--bg);
      }
      .btn-sm {
        padding: 7px 13px;
        font-size: 13px;
      }
      .btn-danger {
        border-color: rgba(212, 87, 74, 0.4);
        color: var(--hearts);
      }
      .btn-p1 {
        background: rgba(123, 184, 240, 0.15);
        border-color: var(--p1);
        color: var(--p1);
        font-weight: 500;
      }
      .btn-p2 {
        background: rgba(208, 128, 208, 0.15);
        border-color: var(--p2);
        color: var(--p2);
        font-weight: 500;
      }
      .section-label {
        font-size: 11px;
        color: var(--text3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: block;
      }
      input,
      textarea {
        background: var(--surface2);
        border: 0.5px solid var(--border2);
        border-radius: 8px;
        padding: 9px 13px;
        color: var(--text);
        font-size: 14px;
        font-family: "DM Sans", sans-serif;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
      }
      input:focus,
      textarea:focus {
        border-color: var(--gold2);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
        line-height: 1.5;
      }
      .fade-in {
        animation: fadeIn 0.35s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      /* HOME */
      .home-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 1.5rem;
      }
      .game-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem 1.25rem;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .game-card:hover {
        background: var(--surface2);
        border-color: var(--border2);
        transform: translateY(-2px);
      }
      .game-card-icon {
        font-size: 36px;
        margin-bottom: 0.75rem;
      }
      .game-card-name {
        font-family: "Playfair Display", serif;
        font-size: 16px;
        font-weight: 400;
        color: var(--text);
        margin-bottom: 4px;
      }
      .game-card-name em {
        font-style: italic;
        color: var(--gold);
      }
      .game-card-desc {
        font-size: 11px;
        color: var(--text3);
        line-height: 1.5;
      }

      /* BARAJA — STEPS */
      .steps {
        display: flex;
        gap: 6px;
        margin-bottom: 1.5rem;
        align-items: center;
        justify-content: center;
      }
      .step {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0.5px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--text3);
      }
      .step.active {
        background: var(--gold2);
        border-color: var(--gold2);
        color: #f0ece4;
        font-weight: 500;
      }
      .step.done {
        background: var(--surface2);
        border-color: var(--border2);
        color: var(--gold);
      }
      .step-line {
        flex: 1;
        height: 0.5px;
        background: var(--border2);
      }
      .deck-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1rem;
      }
      .deck-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
      }
      .deck-card:hover {
        background: var(--surface2);
        border-color: var(--border2);
      }
      .deck-card.selected {
        border-color: var(--gold2);
        background: rgba(138, 111, 48, 0.12);
      }
      .deck-icon {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .deck-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 2px;
      }
      .deck-desc {
        font-size: 11px;
        color: var(--text3);
        line-height: 1.4;
      }
      .deck-count {
        font-size: 10px;
        color: var(--gold2);
        margin-top: 4px;
      }
      .player-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 1.25rem;
      }
      .ptab {
        flex: 1;
        padding: 9px;
        border-radius: 10px;
        border: 0.5px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
      }
      .ptab.active-p1 {
        background: rgba(123, 184, 240, 0.12);
        border-color: var(--p1);
        color: var(--p1);
        font-weight: 500;
      }
      .ptab.active-p2 {
        background: rgba(208, 128, 208, 0.12);
        border-color: var(--p2);
        color: var(--p2);
        font-weight: 500;
      }
      .q-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 0.75rem;
      }
      .q-item {
        background: var(--surface2);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .q-item-text {
        flex: 1;
        font-size: 13px;
        color: var(--text);
        line-height: 1.5;
      }
      .q-item-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        white-space: nowrap;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .badge-soft {
        background: rgba(109, 184, 122, 0.15);
        color: var(--clubs);
      }
      .badge-mid {
        background: rgba(212, 136, 74, 0.15);
        color: var(--diamonds);
      }
      .badge-hard {
        background: rgba(212, 87, 74, 0.15);
        color: var(--hearts);
      }
      .q-del {
        background: none;
        border: none;
        color: var(--text3);
        font-size: 15px;
        cursor: pointer;
        padding: 0 3px;
        line-height: 1;
        transition: color 0.15s;
      }
      .q-del:hover {
        color: var(--hearts);
      }
      .empty-hint {
        font-size: 12px;
        color: var(--text3);
        text-align: center;
        padding: 1rem 0;
        font-style: italic;
      }
      .add-q-form {
        background: var(--surface2);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-top: 0.75rem;
      }
      .intensity-row {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .int-btn {
        flex: 1;
        padding: 7px;
        border-radius: 8px;
        border: 0.5px solid var(--border2);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .int-btn.sel-soft {
        background: rgba(109, 184, 122, 0.15);
        border-color: var(--clubs);
        color: var(--clubs);
      }
      .int-btn.sel-mid {
        background: rgba(212, 136, 74, 0.15);
        border-color: var(--diamonds);
        color: var(--diamonds);
      }
      .int-btn.sel-hard {
        background: rgba(212, 87, 74, 0.15);
        border-color: var(--hearts);
        color: var(--hearts);
      }
      .legend-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1.25rem;
      }
      .legend-item {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 11px 13px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .legend-sym {
        font-size: 18px;
        line-height: 1;
        margin-top: 1px;
      }
      .legend-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 1px;
      }
      .legend-desc {
        font-size: 11px;
        color: var(--text3);
      }
      .legend-item.s .legend-sym {
        color: var(--spades);
      }
      .legend-item.h .legend-sym {
        color: var(--hearts);
      }
      .legend-item.d .legend-sym {
        color: var(--diamonds);
      }
      .legend-item.c .legend-sym {
        color: var(--clubs);
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
      }
      .top-bar-title {
        font-family: "Playfair Display", serif;
        font-size: 15px;
        color: var(--gold);
        font-style: italic;
      }
      .stats {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .stat {
        text-align: center;
      }
      .stat-n {
        font-size: 17px;
        font-weight: 500;
        color: var(--text);
        line-height: 1;
      }
      .stat-l {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .stat-sep {
        width: 0.5px;
        height: 26px;
        background: var(--border2);
      }
      .turn-label {
        text-align: center;
        font-size: 13px;
        color: var(--text3);
        margin-bottom: 1.25rem;
      }
      .turn-name {
        font-weight: 500;
        color: var(--text);
      }
      .card-area {
        display: flex;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .card {
        width: 150px;
        height: 210px;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.15s;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 12px;
        user-select: none;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card:active {
        transform: scale(0.98);
      }
      .card-back {
        background: var(--surface);
        border: 0.5px solid var(--border2);
        align-items: center;
        justify-content: center;
      }
      .card-back-inner {
        width: 110px;
        height: 165px;
        border-radius: 8px;
        border: 0.5px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: center;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 4px,
          rgba(201, 168, 76, 0.04) 4px,
          rgba(201, 168, 76, 0.04) 8px
        );
      }
      .card-back-sym {
        font-size: 34px;
        opacity: 0.25;
      }
      .card-face {
        border: 0.5px solid rgba(255, 255, 255, 0.1);
      }
      .card-face.spades {
        background: #1c1e22;
      }
      .card-face.hearts {
        background: #1e1616;
      }
      .card-face.diamonds {
        background: #1e1810;
      }
      .card-face.clubs {
        background: #121e14;
      }
      .card-corner-top {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.1;
      }
      .card-corner-bot {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.1;
        transform: rotate(180deg);
        margin-top: auto;
      }
      .card-val {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        font-weight: 600;
      }
      .card-sym-s {
        font-size: 13px;
      }
      .card-center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-sym-big {
        font-size: 46px;
        line-height: 1;
      }
      .card-face.spades .card-val,
      .card-face.spades .card-sym-s,
      .card-face.spades .card-sym-big {
        color: var(--spades);
      }
      .card-face.hearts .card-val,
      .card-face.hearts .card-sym-s,
      .card-face.hearts .card-sym-big {
        color: var(--hearts);
      }
      .card-face.diamonds .card-val,
      .card-face.diamonds .card-sym-s,
      .card-face.diamonds .card-sym-big {
        color: var(--diamonds);
      }
      .card-face.clubs .card-val,
      .card-face.clubs .card-sym-s,
      .card-face.clubs .card-sym-big {
        color: var(--clubs);
      }
      .draw-hint {
        text-align: center;
        font-size: 12px;
        color: var(--text3);
        margin-top: -0.5rem;
        margin-bottom: 1rem;
        letter-spacing: 0.05em;
        animation: pulse 2s infinite;
      }
      .q-box {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1.25rem 1rem;
        margin-bottom: 1rem;
        animation: fadeIn 0.35s ease;
      }
      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .q-cat {
        font-size: 11px;
        color: var(--text3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .q-dots {
        display: flex;
        gap: 4px;
      }
      .q-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border2);
      }
      .q-dot.on {
        background: var(--gold);
      }
      .q-dot.fire {
        background: var(--hearts);
      }
      .q-source {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 8px;
        display: inline-block;
      }
      .src-p1 {
        background: rgba(123, 184, 240, 0.12);
        color: var(--p1);
      }
      .src-p2 {
        background: rgba(208, 128, 208, 0.12);
        color: var(--p2);
      }
      .mechanic-tag {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 8px;
      }
      .tag-j {
        background: rgba(55, 138, 221, 0.15);
        color: #7bb8f0;
        border: 0.5px solid rgba(55, 138, 221, 0.25);
      }
      .tag-q {
        background: rgba(180, 70, 180, 0.15);
        color: #d080d0;
        border: 0.5px solid rgba(180, 70, 180, 0.25);
      }
      .tag-k {
        background: rgba(201, 168, 76, 0.15);
        color: var(--gold);
        border: 0.5px solid rgba(201, 168, 76, 0.25);
      }
      .tag-a {
        background: rgba(109, 184, 122, 0.15);
        color: var(--clubs);
        border: 0.5px solid rgba(109, 184, 122, 0.25);
      }
      .mechanic-desc {
        font-size: 12px;
        color: var(--text3);
        margin-bottom: 10px;
        font-style: italic;
        line-height: 1.5;
      }
      .q-text {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        color: var(--text);
        line-height: 1.6;
      }
      .ace-input-box {
        margin-top: 10px;
      }
      .ace-input-box textarea {
        font-family: "Playfair Display", serif;
        font-size: 15px;
        min-height: 70px;
      }
      .action-row {
        display: flex;
        gap: 8px;
        margin-bottom: 1rem;
      }
      .btn-next {
        flex: 1;
        padding: 12px;
      }
      .hist-toggle {
        width: 100%;
        background: none;
        border: none;
        color: var(--text3);
        font-size: 12px;
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        padding: 6px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        transition: color 0.15s;
        text-align: center;
      }
      .hist-panel {
        margin-top: 0.75rem;
        border-top: 0.5px solid var(--border);
        padding-top: 0.75rem;
      }
      .hist-item {
        display: flex;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 0.5px solid var(--border);
        align-items: flex-start;
      }
      .hist-item:last-child {
        border-bottom: none;
      }
      .hist-tag {
        font-family: "Playfair Display", serif;
        font-size: 13px;
        min-width: 34px;
        color: var(--gold2);
      }
      .hist-q {
        font-size: 12px;
        color: var(--text3);
        line-height: 1.4;
        flex: 1;
      }
      .end-screen {
        text-align: center;
        padding: 2rem 0;
        animation: fadeIn 0.5s ease;
      }
      .end-screen h2 {
        font-family: "Playfair Display", serif;
        font-size: 26px;
        color: var(--gold);
        margin-bottom: 0.5rem;
      }
      .end-screen p {
        font-size: 14px;
        color: var(--text3);
        margin-bottom: 1.5rem;
      }
      .summary-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1.5rem;
      }
      .summary-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
      }
      .summary-n {
        font-size: 22px;
        font-weight: 500;
        color: var(--text);
        line-height: 1;
      }
      .summary-l {
        font-size: 11px;
        color: var(--text3);
        margin-top: 3px;
      }

      /* CMC */
      .cmc-progress {
        height: 3px;
        background: var(--surface2);
        border-radius: 2px;
        margin-bottom: 1.5rem;
        overflow: hidden;
      }
      .cmc-progress-bar {
        height: 100%;
        background: var(--gold2);
        border-radius: 2px;
        transition: width 0.3s ease;
      }
      .cmc-question-box {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        animation: fadeIn 0.3s ease;
      }
      .cmc-qnum {
        font-size: 11px;
        color: var(--text3);

        return `<div class="fade-in"><div class="logo" style="margin-bottom:1rem;"><div class="logo-suit">♠ ♥ ♦ ♣</div><h1>La baraja del <em>abismo</em></h1></div>${bSteps("rules")}<div class="card-bg" style="margin-bottom:1rem;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:0.75rem;"><span style="font-size:22px;">${m.icon}</span><div><div style="font-size:14px;font-weight:500;">${m.nombre}</div><div style="font-size:12px;color:var(--text3);">${total} preguntas</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;"><div style="font-size:20px;font-weight:500;">${B.customQ[0].length}</div><div style="font-size:11px;color:var(--p1);margin-top:2px;">${san(B.p1) || "J1"}</div></div><div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;"><div style="font-size:20px;font-weight:500;">${B.customQ[1].length}</div><div style="font-size:11px;color:var(--p2);margin-top:2px;">${san(B.p2) || "J2"}</div></div><div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;"><div style="font-size:20px;font-weight:500;color:var(--gold);">${total}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">Mazo</div></div></div></div><div class="legend-grid"><div class="legend-item s"><span class="legend-sym">♠</span><div><div class="legend-name">Espadas</div><div class="legend-desc">Pasado · 2–10</div></div></div><div class="legend-item h"><span class="legend-sym">♥</span><div><div class="legend-name">Corazones</div><div class="legend-desc">Amor · 2–10</div></div></div><div class="legend-item d"><span class="legend-sym">♦</span><div><div class="legend-name">Diamantes</div><div class="legend-desc">Sueños · 2–10</div></div></div><div class="legend-item c"><span class="legend-sym">♣</span><div><div class="legend-name">Tréboles</div><div class="legend-desc">Filosóficas · 2–10</div></div></div></div><div class="card-bg" style="margin-bottom:1rem;"><div style="font-size:13px;font-weight:500;margin-bottom:0.75rem;">Figuras especiales</div><div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;gap:10px;align-items:flex-start;"><span class="mechanic-tag tag-j" style="flex-shrink:0;">J</span><span style="font-size:13px;color:var(--text2);">El otro responde primero. Pregunta fuerte.</span></div><div style="display:flex;gap:10px;align-items:flex-start;"><span class="mechanic-tag tag-q" style="flex-shrink:0;">Q</span><span style="font-size:13px;color:var(--text2);">Adivina cómo respondería el otro. Pregunta fuerte.</span></div><div style="display:flex;gap:10px;align-items:flex-start;"><span class="mechanic-tag tag-k" style="flex-shrink:0;">K</span><span style="font-size:13px;color:var(--text2);">Cuenten 3 y respondan al mismo tiempo.</span></div><div style="display:flex;gap:10px;align-items:flex-start;"><span class="mechanic-tag tag-a" style="flex-shrink:0;">A</span><span style="font-size:13px;color:var(--text2);">Tú escribes la pregunta. Comodín total.</span></div></div></div><div style="display:flex;gap:8px;"><button class="btn btn-sm" onclick="bGoTo('questions')" style="padding:11px 16px;">← Atrás</button><button class="btn btn-primary" style="flex:1;padding:13px;" onclick="startBGame()">¡Repartir el mazo!</button></div></div>`;
      }
      function shuffle(a) {
        const arr = [...a];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function buildBPool() {
        const d = ALL_MAZOS[B.selectedDeck];
        const pool = {
          spades: { soft: [], mid: [], hard: [] },
          hearts: { soft: [], mid: [], hard: [] },
          diamonds: { soft: [], mid: [], hard: [] },
          clubs: { soft: [], mid: [], hard: [] },
        };
        const src = {
          spades: { soft: [], mid: [], hard: [] },
          hearts: { soft: [], mid: [], hard: [] },
          diamonds: { soft: [], mid: [], hard: [] },
          clubs: { soft: [], mid: [], hard: [] },
        };
        if (d) {
          for (const s of SUITS)
            for (const i of ["soft", "mid", "hard"]) {
              const qs = d[s]?.[i] || [];
              pool[s][i].push(...qs);
              src[s][i].push(...qs.map(() => "base"));
            }
        }
        let si = 0;
        for (let pi = 0; pi < 2; pi++) {
          const pn = pi === 0 ? "p1" : "p2";
          for (const q of B.customQ[pi]) {
            const suit = SUITS[si % 4];
            pool[suit][q.intensity].push(q.text);
            src[suit][q.intensity].push(pn);
            si++;
          }
        }
        window._bsrc = src;
        return pool;
      }
      function buildBDeck() {
        const d = [];
        for (const s of SUITS)
          for (const v of VALS) d.push({ suit: s, val: v });
        return d;
      }
      function getBQ(pool, suit, val) {
        if (["J", "Q", "K"].includes(val)) {
          const all = [],
            allS = [];
          for (const s of SUITS) {
            pool[s].hard.forEach((q, i) => {
              if (!B.usedQuestions.has(q)) {
                all.push(q);
                allS.push(window._bsrc[s].hard[i]);
              }
            });
          }
          if (!all.length) {
            for (const s of SUITS) {
              pool[s].mid.forEach((q, i) => {
                if (!B.usedQuestions.has(q)) {
                  all.push(q);
                  allS.push(window._bsrc[s].mid[i]);
                }
              });
            }
          }
          if (!all.length)
            return {
              text: "Inventa la pregunta más difícil que puedas hacerle a tu pareja.",
              source: "base",
            };
          const idx = Math.floor(Math.random() * all.length);
          B.usedQuestions.add(all[idx]);
          return { text: all[idx], source: allS[idx] };
        }
        if (val === "A") return { text: "__ACE__", source: "ace" };
        const n = parseInt(val),
          intensity = n <= 5 ? "soft" : n <= 9 ? "mid" : "hard";
        let av = pool[suit][intensity]
          .map((q, i) => ({ text: q, src: window._bsrc[suit][intensity][i] }))
          .filter((q) => !B.usedQuestions.has(q.text));
        if (!av.length) {
          for (const o of ["soft", "mid", "hard"].filter(
            (x) => x !== intensity,
          )) {
            av.push(
              ...pool[suit][o]
                .map((q, i) => ({ text: q, src: window._bsrc[suit][o][i] }))
                .filter((q) => !B.usedQuestions.has(q.text)),
            );
          }
        }
        if (!av.length) {
          for (const s of SUITS)
            for (const i of ["soft", "mid", "hard"]) {
              pool[s][i].forEach((q, idx) => {
                if (!B.usedQuestions.has(q))
                  av.push({ text: q, src: window._bsrc[s][i][idx] });
              });
            }
        }
        if (!av.length) {
          const l = pool[suit][intensity];
          const idx = Math.floor(Math.random() * l.length);
          return { text: l[idx], source: "base" };
        }
        const pick = av[Math.floor(Math.random() * av.length)];
        B.usedQuestions.add(pick.text);
        return { text: pick.text, source: pick.src };
      }
      function getIntensity(val) {
        if (FIGURES.includes(val)) return 3;
        const n = parseInt(val);
        return n <= 5 ? 1 : n <= 9 ? 2 : 3;
      }
      function startBGame() {
        window._bpool = buildBPool();
        B.deck = shuffle(buildBDeck());
        B.phase = "game";
        B.history = [];
        B.turn = 0;
        B.card = null;
        B.question = null;
        B.source = null;
        B.showCard = false;
        B.showHistory = false;
        B.aceInput = "";
        B.aceConfirmed = false;
        B.usedQuestions = new Set();
        renderBaraja();
      }
      function renderBGame() {
        const player = B.turn % 2 === 0 ? B.p1 || "J1" : B.p2 || "J2",
          played = B.history.length,
          remaining = B.deck.length;
        let cH = "";
        if (!B.showCard) {
          cH = `<div class="card card-back" style="display:flex;" onclick="drawBCard()"><div class="card-back-inner"><span class="card-back-sym">🂠</span></div></div>`;
        } else {
          const c = B.card;
          cH = `<div class="card card-face ${c.suit}"><div class="card-corner-top"><span class="card-val">${c.val}</span><span class="card-sym-s">${SYMS[c.suit]}</span></div><div class="card-center"><span class="card-sym-big">${SYMS[c.suit]}</span></div><div class="card-corner-bot"><span class="card-val">${c.val}</span><span class="card-sym-s">${SYMS[c.suit]}</span></div></div>`;
        }
        let qH = "";
        if (B.card && B.showCard) {
          const intensity = getIntensity(B.card.val);
          const dots = [1, 2, 3]
            .map(
              (i) =>
                `<div class="q-dot ${i <= intensity ? (intensity === 3 ? "fire" : "on") : ""}"></div>`,
            )
            .join("");
          const isAce = B.card.val === "A",
            isFig = FIGURES.includes(B.card.val);
          let mH = "";
          if (isFig) {
            const m = MECHANICS[B.card.val];
            mH = `<span class="mechanic-tag ${m.tag}">${m.label}</span><div class="mechanic-desc">${m.desc}</div>`;
          }
          let sH = "";
          if (B.source === "p1")
            sH = `<span class="q-source src-p1">de ${san(B.p1) || "J1"}</span><br>`;
          else if (B.source === "p2")
            sH = `<span class="q-source src-p2">de ${san(B.p2) || "J2"}</span><br>`;
          let bH = "";
          if (isAce) {
            bH = !B.aceConfirmed
              ? `<div class="ace-input-box"><textarea id="aceTA" placeholder="Escribe aquí tu pregunta comodín..." rows="3">${B.aceInput}</textarea><button class="btn btn-primary" style="width:100%;margin-top:8px;padding:10px;" onclick="confirmBAce()">Confirmar →</button></div>`
              : `<div class="q-text">${san(B.aceInput)}</div>`;
          } else {
            bH = `<div class="q-text">${san(B.question || "")}</div>`;
          }
          const showNext = !isAce || (isAce && B.aceConfirmed);
          qH = `<div class="q-box"><div class="q-header"><span class="q-cat">${isAce ? "As · Comodín libre" : SUIT_NAMES[B.card.suit]}</span><div class="q-dots">${dots}</div></div>${sH}${mH}${bH}</div>${showNext ? `<div class="action-row"><button class="btn btn-next" onclick="nextBTurn()">Siguiente turno →</button><button class="btn btn-sm btn-danger" onclick="if(confirm('¿Reiniciar?'))resetB()">⟳</button></div>` : ""}`;
        }
        let hH = "";
        if (B.showHistory && B.history.length > 0) {
          hH = `<div class="hist-panel">${[...B.history]
            .reverse()
            .slice(0, 15)
            .map(
              (h) =>
                `<div class="hist-item"><span class="hist-tag">${h.val}${SYMS[h.suit]}</span><span class="hist-q">${san(h.question)}</span></div>`,
            )
            .join("")}</div>`;
        }
        return `<div class="fade-in"><div class="top-bar"><span class="top-bar-title">La baraja del abismo</span><div class="stats"><div class="stat"><div class="stat-n">${played}</div><div class="stat-l">Jugadas</div></div><div class="stat-sep"></div><div class="stat"><div class="stat-n">${remaining}</div><div class="stat-l">En mazo</div></div></div></div><div class="turn-label">Le toca a <span class="turn-name">${player}</span></div><div class="card-area">${cH}</div>${!B.showCard ? '<div class="draw-hint">toca la carta para robar</div>' : ""}${qH}<button class="hist-toggle" onclick="toggleBHist()">${B.showHistory ? "▴ Ocultar" : "▾ Ver"} historial (${played})</button>${hH}</div>`;
      }
      function bindBGame() {
        const ta = document.getElementById("aceTA");
        if (ta)
          ta.addEventListener("input", (e) => (B.aceInput = e.target.value));
      }
      function confirmBAce() {
        const ta = document.getElementById("aceTA");
        if (ta) B.aceInput = ta.value;
        if (!B.aceInput.trim()) return;
        B.aceConfirmed = true;
        renderBaraja();
      }
      function drawBCard() {
        if (B.deck.length === 0) {
          B.phase = "end";
          renderBaraja();
          return;
        }
        const c = B.deck.pop();
        B.card = c;
        B.aceInput = "";
        B.aceConfirmed = false;
        const r = getBQ(window._bpool, c.suit, c.val);
        B.question = r.text === "__ACE__" ? "" : r.text;
        B.source = r.source;
        B.showCard = true;
        renderBaraja();
      }
      function nextBTurn() {
        const q = B.card && B.card.val === "A" ? B.aceInput : B.question;
        if (B.card) B.history.push({ ...B.card, question: san(q) || "—" });
        B.turn++;
        B.card = null;
        B.question = null;
        B.source = null;
        B.showCard = false;
        B.aceInput = "";
        B.aceConfirmed = false;
        if (B.deck.length === 0) {
          B.phase = "end";
          renderBaraja();
          return;
        }
        renderBaraja();
      }
      function toggleBHist() {
        B.showHistory = !B.showHistory;
        renderBaraja();
      }
      function resetB() {
        B.phase = "names";
        B.customQ = [[], []];
        B.newQText = "";
        B.usedQuestions = new Set();
        renderBaraja();
      }
      function renderBEnd() {
        return `<div class="end-screen"><div class="logo"><div class="logo-suit">♠ ♥ ♦ ♣</div><h1>La baraja del <em>abismo</em></h1></div><h2>¡Mazo agotado!</h2><p>${B.history.length} preguntas en una sola noche.</p><div class="summary-row"><div class="summary-card"><div class="summary-n">${B.history.length}</div><div class="summary-l">Respondidas</div></div><div class="summary-card"><div class="summary-n">${B.customQ[0].length + B.customQ[1].length}</div><div class="summary-l">Personalizadas</div></div></div><button class="btn btn-primary" style="width:100%;padding:13px;margin-bottom:0.75rem;" onclick="startBGame()">Jugar de nuevo</button><button class="btn" style="width:100%;padding:11px;" onclick="goHome()">← Inicio</button></div>`;
      }

      // ══════════════════════════════════════════════════════════════════════════════
      // ¿CUÁNTO ME CONOCES?
      // ══════════════════════════════════════════════════════════════════════════════
      function renderCMC() {
        const app = document.getElementById("app");
        if (C.phase === "setup") app.innerHTML = renderCMCSetup();
        else if (C.phase === "answering") app.innerHTML = renderCMCAnswering();
        else if (C.phase === "share") app.innerHTML = renderCMCShare();
        else if (C.phase === "guessing") app.innerHTML = renderCMCGuessing();
        else if (C.phase === "results") app.innerHTML = renderCMCResults();
        // bind free text inputs
        const ft = document.getElementById("cmc-free-input");
        if (ft)
          ft.addEventListener("input", (e) => {
            const q = C.selectedQs[C.currentIdx];
            C.myAnswers[q.id] = e.target.value;
          });
        const gft = document.getElementById("cmc-guess-free");
        if (gft)
          gft.addEventListener("input", (e) => {
            const q = C.selectedQs[C.currentIdx];
            C.guesses[q.id] = e.target.value;
          });
      }

      function renderCMCSetup() {
        return `<div class="fade-in">
    <div class="logo" style="margin-bottom:1rem;">
      <div class="logo-suit">🧠</div>
      <h1>¿Cuánto<br>me <em>conoces?</em></h1>
      <div class="logo-sub">Responde · Comparte · Adivina</div>
    </div>
    <div class="card-bg" style="margin-bottom:1rem;">
      <span class="section-label">Tu nombre</span>

      <span class="section-label">Nombre de tu pareja</span>

    </div>
    <div class="card-bg" style="margin-bottom:1rem;">
      <span class="section-label">Número de preguntas</span>

        ${[5, 10, 15, 20].map((n) => `<button class="btn btn-sm ${C.questionCount === n ? "btn-primary" : ""}" onclick="setCMCCount(${n})" style="flex:1;">${n}</button>`).join("")}

      <strong style="color:var(--text);font-weight:500;">¿Cómo funciona?</strong><br>

    </div>
    <div style="display:flex;gap:8px;">

      function setCMCCount(n) {
        C.questionCount = n;

        if (pi) C.p2 = pi.value;

      }

      function startCMCAnswering() {
        const ni = document.getElementById("cmc-name");
        const pi = document.getElementById("cmc-partner");
        if (ni) C.myName = ni.value.trim();
        if (pi) C.p2 = pi.value.trim();
        if (!C.myName) {
          alert("Escribe tu nombre para continuar");
          return;
        }
        // Select random questions
        const shuffled = shuffle([...CMC_QUESTIONS]);
        C.selectedQs = shuffled.slice(0, C.questionCount);
        C.currentIdx = 0;
        C.myAnswers = {};
        C.phase = "answering";
        renderCMC();
      }

      function renderCMCAnswering() {
        const q = C.selectedQs[C.currentIdx];
        const progress = (C.currentIdx / C.selectedQs.length) * 100;
        const myAns = C.myAnswers[q.id];
        let inputHTML = "";
        if (q.type === "multiple") {
          inputHTML = `<div class="cmc-options">${q.options.map((o, i) => `<button class="cmc-opt ${myAns === String(i) ? "selected" : ""}" onclick="setCMCAns('${q.id}','${i}')">${o}</button>`).join("")}</div>`;
        } else if (q.type === "truefalse") {
          inputHTML = `<div class="cmc-tf-row">
      <button class="cmc-tf-btn ${myAns === "true" ? "selected" : ""}" onclick="setCMCAns('${q.id}','true')">✓ Verdadero</button>
      <button class="cmc-tf-btn ${myAns === "false" ? "selected" : ""}" onclick="setCMCAns('${q.id}','false')">✗ Falso</button>
    </div>`;
        } else if (q.type === "scale") {
          inputHTML = `<div class="cmc-scale-row">${[1, 2, 3, 4, 5].map((n) => `<button class="cmc-scale-btn ${myAns === String(n) ? "selected" : ""}" onclick="setCMCAns('${q.id}','${n}')" style="height:${30 + n * 8}px;">${n}</button>`).join("")}</div>
    <div class="cmc-scale-labels"><span>${q.label_min}</span><span>${q.label_max}</span></div>`;
        } else {
          inputHTML = `<textarea id="cmc-free-input" class="cmc-free-input" placeholder="Escribe tu respuesta..." rows="3">${myAns || ""}</textarea>`;
        }
        // Para preguntas libres el botón siempre está activo — se valida al presionar
        const isFree = q.type === "free";
        const hasAns = isFree ? true : myAns !== undefined && myAns !== "";
        return `<div class="fade-in">

      <span class="cmc-player-badge badge-p1">✏️ ${san(C.myName) || "Tú"}</span>

      <button class="btn btn-primary" style="flex:1;padding:13px;" onclick="nextCMC()" ${!hasAns ? "disabled style='opacity:0.5;cursor:default;'" : ""}>
        ${C.currentIdx < C.selectedQs.length - 1 ? "Siguiente →" : "Ver mi link →"}
      </button>
    </div>
  </div>`;
      }

      function setCMCAns(qid, val) {
        C.myAnswers[qid] = val;
        renderCMC();
      }

      function prevCMC() {
        if (C.currentIdx > 0) {
          C.currentIdx--;
          renderCMC();
        }
      }

      function nextCMC() {
        const q = C.selectedQs[C.currentIdx];
        // save free text before validating
        const ft = document.getElementById("cmc-free-input");
        if (ft && q.type === "free") C.myAnswers[q.id] = ft.value.trim();
        // for free questions allow empty (optional) — just warn once
        if (
          q.type === "free" &&
          (!C.myAnswers[q.id] || C.myAnswers[q.id] === "")
        ) {
          C.myAnswers[q.id] = "(sin respuesta)";
        }
        // for other types require an answer
        if (
          q.type !== "free" &&
          (C.myAnswers[q.id] === undefined || C.myAnswers[q.id] === "")
        )
          return;
        if (C.currentIdx < C.selectedQs.length - 1) {
          C.currentIdx++;
          renderCMC();
        } else {
          generateCMCLink();
        }
      }

      function generateCMCLink() {
        const payload = {
          name: C.myName,
          partner: C.p2,
          qs: C.selectedQs.map((q) => q.id),
          ans: C.myAnswers,
        };
        const encoded = btoa(
          unescape(encodeURIComponent(JSON.stringify(payload))),
        );
        const base = window.location.origin + window.location.pathname;
        C.shareUrl = `${base}?cmc=guess&d=${encoded}`;
        C.phase = "share";
        renderCMC();
      }

      function renderCMCShare() {
        return `<div class="fade-in">
    <div class="logo" style="margin-bottom:1rem;">
      <div class="logo-suit">🧠</div>
      <h1>¿Cuánto<br>me <em>conoces?</em></h1>
    </div>
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:48px;margin-bottom:0.5rem;">🎉</div>
      <div style="font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px;">¡Listo, ${san(C.myName) || ""}!</div>
      <div style="font-size:14px;color:var(--text3);">Mándale este link a ${san(C.p2) || "tu pareja"}</div>
    </div>
    <div class="cmc-share-box">
      <div class="cmc-share-url">${C.shareUrl || ""}</div>
      <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="copyLink()">📋 Copiar link</button>
    </div>
    <div class="card-bg" style="margin-bottom:1rem;font-size:13px;color:var(--text2);line-height:1.7;">
      <strong style="color:var(--text);font-weight:500;">Qué pasa ahora:</strong><br>
      ${san(C.p2) || "Tu pareja"} abre el link y trata de adivinar tus ${C.selectedQs.length} respuestas.<br>
      Por cada acierto gana puntos. Al final ven juntos el resultado.
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="flex:1;padding:11px;" onclick="goHome()">← Inicio</button>
      <button class="btn btn-sm" onclick="if(confirm('¿Jugar de nuevo desde cero?'))startCMC()" style="padding:11px 16px;">Nuevo</button>
    </div>
  </div>`;
      }

      function copyLink() {
        navigator.clipboard
          .writeText(C.shareUrl || "")
          .then(() => {
            const btn = document.querySelector(".cmc-share-box .btn-primary");
            if (btn) {
              btn.textContent = "✓ Copiado!";
              setTimeout(() => {
                btn.textContent = "📋 Copiar link";
              }, 2000);
            }
          })
          .catch(() => {
            // fallback
            const ta = document.createElement("textarea");
            ta.value = C.shareUrl || "";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            alert("Link copiado!");
          });
      }

      function loadCMCFromURL(params) {
        try {
          const raw = params.get("d");
          if (!raw) throw new Error();
          const payload = JSON.parse(decodeURIComponent(escape(atob(raw))));
          // Rebuild selected questions from IDs
          const qMap = {};
          CMC_QUESTIONS.forEach((q) => (qMap[q.id] = q));
          C.selectedQs = payload.qs.map((id) => qMap[id]).filter(Boolean);
          C.myAnswers = payload.ans;
          C.p1 = payload.name;
          C.myName = payload.partner || "";
          C.guesses = {};
          C.currentIdx = 0;
          C.phase = "guessing";
          C.role = "guesser";
          renderCMC();
        } catch (e) {
          APP.mode = null;
          history.pushState({}, "", window.location.pathname);
          render();
        }
      }

      function renderCMCGuessing() {
        const q = C.selectedQs[C.currentIdx];
        const progress = (C.currentIdx / C.selectedQs.length) * 100;
        const myGuess = C.guesses[q.id];
        const revealed = C.showResult && myGuess !== undefined;
        const correctAns = C.myAnswers[q.id];

        function optClass(val) {
          if (!revealed) return myGuess === val ? "selected" : "";
          if (val === correctAns) return "correct";
          if (val === myGuess && myGuess !== correctAns) return "wrong";
          return "";
        }

        let inputHTML = "";
        if (q.type === "multiple") {
          inputHTML = `<div class="cmc-options">${q.options
            .map((o, i) => {
              const v = String(i);
              return `<button class="cmc-opt ${optClass(v)}" onclick="${!revealed ? `setGuess('${q.id}','${v}')` : ""}">${o}${revealed && v === correctAns ? " ✓" : revealed && v === myGuess && myGuess !== correctAns ? " ✗" : ""}</button>`;
            })
            .join("")}</div>`;
        } else if (q.type === "truefalse") {
          inputHTML = `<div class="cmc-tf-row">
      <button class="cmc-tf-btn ${optClass("true")}" onclick="${!revealed ? `setGuess('${q.id}','true')` : ""}" >✓ Verdadero</button>
      <button class="cmc-tf-btn ${optClass("false")}" onclick="${!revealed ? `setGuess('${q.id}','false')` : ""}" >✗ Falso</button>
    </div>`;
        } else if (q.type === "scale") {
          inputHTML = `<div class="cmc-scale-row">${[1, 2, 3, 4, 5]
            .map((n) => {
              const v = String(n);
              return `<button class="cmc-scale-btn ${optClass(v)}" onclick="${!revealed ? `setGuess('${q.id}','${v}')` : ""}" style="height:${30 + n * 8}px;">${n}</button>`;
            })
            .join("")}</div>
    <div class="cmc-scale-labels"><span>${q.label_min}</span><span>${q.label_max}</span></div>`;
        } else {
          if (!revealed) {
            inputHTML = `<textarea id="cmc-guess-free" placeholder="¿Qué crees que respondió ${san(C.p1) || "él/ella"}?" rows="3">${san(myGuess) || ""}</textarea>`;
          } else {
            const isClose =
              myGuess &&
              correctAns &&
              myGuess.trim().toLowerCase() === correctAns.trim().toLowerCase();
            inputHTML = `<div class="cmc-free-answer" style="margin-bottom:8px;"><strong style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px;">TU RESPUESTA</strong>${myGuess || "—"}</div>
      <div class="cmc-free-answer"><strong style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px;">RESPUESTA DE ${san(C.p1 || "").toUpperCase()}</strong>${san(correctAns) || "—"}</div>`;
          }
        }

        let revealBox = "";
        if (revealed && q.type !== "free") {
          const correct = myGuess === correctAns;
          revealBox = `<div class="cmc-reveal-box ${correct ? "cmc-reveal-correct" : "cmc-reveal-wrong"}">
      ${correct ? "✓ ¡Correcto! +1 punto" : "✗ Respuesta incorrecta"}
    </div>`;
        }

        // Para preguntas libres el botón siempre está activo
        const hasGuess =
          q.type === "free" ? true : myGuess !== undefined && myGuess !== "";
        return `<div class="fade-in">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
      <span class="cmc-player-badge badge-p2">🔍 Adivinando a ${san(C.p1) || "..."}</span>
      <span style="font-size:12px;color:var(--text3);">${C.currentIdx + 1} / ${C.selectedQs.length}</span>
    </div>
    <div class="cmc-progress"><div class="cmc-progress-bar" style="width:${progress}%"></div></div>
    <div class="cmc-question-box">
      <div class="cmc-qnum">${q.type === "multiple" ? "Múltiple opción" : q.type === "truefalse" ? "Verdadero o Falso" : q.type === "scale" ? "Escala 1–5" : "Respuesta libre"}</div>
      <div class="cmc-qtext">${q.text}</div>
      ${inputHTML}
      ${revealBox}
    </div>
    ${
      !revealed
        ? `<button class="btn btn-primary" style="width:100%;padding:13px;" onclick="revealGuess()" ${!hasGuess ? "disabled style='opacity:0.5;cursor:default;'" : ""}>Ver respuesta →</button>`
        : `<button class="btn btn-primary" style="width:100%;padding:13px;" onclick="nextGuess()">
      ${C.currentIdx < C.selectedQs.length - 1 ? "Siguiente →" : "Ver resultados →"}
    </button>`
    }
  </div>`;
      }

      function setGuess(qid, val) {
        if (C.showResult) return;
        C.guesses[qid] = val;
        renderCMC();
      }

      function revealGuess() {
        const q = C.selectedQs[C.currentIdx];
        // save free text before validating
        const gft = document.getElementById("cmc-guess-free");
        if (gft && q.type === "free")
          C.guesses[q.id] = gft.value.trim() || "(sin respuesta)";
        // for non-free require a selection
        if (q.type !== "free" && !C.guesses[q.id] && C.guesses[q.id] !== "0")
          return;
        // score for non-free only
        if (q.type !== "free" && C.guesses[q.id] === C.myAnswers[q.id])
          C.score++;
        C.showResult = true;
        renderCMC();
      }

      function nextGuess() {
        C.showResult = false;
        if (C.currentIdx < C.selectedQs.length - 1) {
          C.currentIdx++;
          renderCMC();
        } else {
          C.phase = "results";
          renderCMC();
        }
      }

      function renderCMCResults() {
        const total = C.selectedQs.filter((q) => q.type !== "free").length;
        const pct = total > 0 ? Math.round((C.score / total) * 100) : 0;
        let emoji = "🤔",
          msg = "Hay margen de mejora jaja";
        if (pct >= 80) {
          emoji = "🥇";
          msg = "¡Los conoces increíble bien!";
        } else if (pct >= 60) {
          emoji = "🎉";
          msg = "¡Bastante bien! Se conocen de verdad.";
        } else if (pct >= 40) {
          emoji = "😅";
          msg = "Van a medias, queda tela que cortar.";
        }

        // Build full review — all questions
        const typeLabels = {
          multiple: "Múltiple opción",
          truefalse: "V o F",
          scale: "Escala",
          free: "Respuesta libre",
        };

        const reviewHTML = C.selectedQs
          .map((q, i) => {
            const correct =
              q.type !== "free" && C.guesses[q.id] === C.myAnswers[q.id];
            const isFree = q.type === "free";
            const borderColor = isFree
              ? "var(--border2)"
              : correct
                ? "rgba(109,184,122,0.4)"
                : "rgba(212,87,74,0.3)";
            const icon = isFree ? "💬" : correct ? "✓" : "✗";
            const iconColor = isFree
              ? "var(--text3)"
              : correct
                ? "var(--clubs)"
                : "var(--hearts)";

            // Format the answer nicely depending on type
            function formatAns(val) {
              if (!val || val === "(sin respuesta)") return "—";
              if (q.type === "multiple") return q.options[parseInt(val)] || val;
              if (q.type === "truefalse")
                return val === "true" ? "Verdadero" : "Falso";
              if (q.type === "scale") return `${val} / 5`;
              return san(val);
            }

            const answered = formatAns(C.myAnswers[q.id]);
            const guessed = formatAns(C.guesses[q.id]);

            return `<div style="background:var(--surface);border:0.5px solid ${borderColor};border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">${typeLabels[q.type] || q.type}</span>
        <span style="font-size:14px;color:${iconColor};font-weight:500;">${icon}</span>
      </div>
      <div style="font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.5;">${q.text}</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:12px;"><span style="color:var(--p1);font-weight:500;">Respondió: </span><span style="color:var(--text2);">${answered}</span></div>
        <div style="font-size:12px;"><span style="color:var(--p2);font-weight:500;">Adivinaste: </span><span style="color:${isFree ? "var(--text2)" : correct ? "var(--clubs)" : "var(--hearts)"};">${guessed}</span></div>
      </div>
    </div>`;
          })
          .join("");

        return `<div class="end-screen">
    <div class="logo">
      <div class="logo-suit">🧠</div>
      <h1>¿Cuánto<br>me <em>conoces?</em></h1>
    </div>
    <div style="font-size:56px;margin:0.5rem 0;">${emoji}</div>
    <div class="cmc-score-big">${C.score} / ${total}</div>
    <p style="margin-bottom:0.5rem;">${msg}</p>
    <p style="font-size:12px;color:var(--text3);margin-bottom:1.5rem;">${pct}% de aciertos en preguntas objetivas</p>
    <div style="text-align:left;margin-bottom:1.5rem;">
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:0.75rem;text-align:center;">Revisen juntos — pregunta por pregunta</div>
      ${reviewHTML}
    </div>
    <button class="btn btn-primary" style="width:100%;padding:13px;margin-bottom:0.75rem;" onclick="startCMC()">Jugar de nuevo</button>
    <button class="btn" style="width:100%;padding:11px;" onclick="goHome()">← Inicio</button>
  </div>`;
      }

      // ── INIT ──────────────────────────────────────────────────────────────────────
      render();
    </script>
  </body>
</html>
