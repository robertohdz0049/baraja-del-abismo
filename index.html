<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Baraja del Abismo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0e0c;
        --surface: #1a1916;
        --surface2: #242320;
        --surface3: #2e2c28;
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.15);
        --border3: rgba(255, 255, 255, 0.25);
        --text: #f0ece4;
        --text2: #9a9589;
        --text3: #5a564f;
        --spades: #c8c0b0;
        --hearts: #d4574a;
        --diamonds: #d4884a;
        --clubs: #6db87a;
        --gold: #c9a84c;
        --gold2: #8a6f30;
        --p1: #7bb8f0;
        --p2: #d080d0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1.5rem;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 30% 20%,
            rgba(201, 168, 76, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 70% 80%,
            rgba(212, 87, 74, 0.04) 0%,
            transparent 50%
          );
        pointer-events: none;
      }
      .app {
        width: 100%;
        max-width: 520px;
        position: relative;
        z-index: 1;
        padding-bottom: 3rem;
      }
      .logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .logo-suit {
        font-size: 13px;
        letter-spacing: 0.3em;
        color: var(--gold2);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      .logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 34px;
        font-weight: 400;
        line-height: 1.1;
      }
      .logo h1 em {
        font-style: italic;
        color: var(--gold);
      }
      .logo-sub {
        font-size: 12px;
        color: var(--text3);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 0.5rem;
      }
      .card-bg {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem;
      }
      .btn {
        padding: 11px 18px;
        border-radius: 10px;
        border: 0.5px solid var(--border2);
        background: transparent;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn:hover {
        background: var(--surface2);
      }
      .btn-primary {
        background: var(--gold2);
        border-color: var(--gold2);
        color: #f0ece4;
        font-weight: 500;
      }
      .btn-primary:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--bg);
      }
      .btn-sm {
        padding: 7px 13px;
        font-size: 13px;
      }
      .btn-danger {
        border-color: rgba(212, 87, 74, 0.4);
        color: var(--hearts);
      }
      .btn-danger:hover {
        background: rgba(212, 87, 74, 0.1);
      }
      .section-label {
        font-size: 11px;
        color: var(--text3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: block;
      }
      input,
      textarea,
      select {
        background: var(--surface2);
        border: 0.5px solid var(--border2);
        border-radius: 8px;
        padding: 9px 13px;
        color: var(--text);
        font-size: 14px;
        font-family: "DM Sans", sans-serif;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--gold2);
      }
      select option {
        background: var(--surface2);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
        line-height: 1.5;
      }
      .fade-in {
        animation: fadeIn 0.35s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-bottom: 1.5rem;
        align-items: center;
        justify-content: center;
      }
      .step {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0.5px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--text3);
      }
      .step.active {
        background: var(--gold2);
        border-color: var(--gold2);
        color: #f0ece4;
        font-weight: 500;
      }
      .step.done {
        background: var(--surface2);
        border-color: var(--border2);
        color: var(--gold);
      }
      .step-line {
        flex: 1;
        height: 0.5px;
        background: var(--border2);
      }
      .deck-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1rem;
      }
      .deck-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
      }
      .deck-card:hover {
        background: var(--surface2);
        border-color: var(--border2);
      }
      .deck-card.selected {
        border-color: var(--gold2);
        background: rgba(138, 111, 48, 0.12);
      }
      .deck-card.locked {
        opacity: 0.5;
        cursor: default;
      }
      .deck-card.locked:hover {
        background: var(--surface);
        border-color: var(--border);
      }
      .deck-icon {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .deck-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 2px;
      }
      .deck-desc {
        font-size: 11px;
        color: var(--text3);
        line-height: 1.4;
      }
      .deck-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        display: inline-block;
        margin-top: 4px;
      }
      .badge-free {
        background: rgba(109, 184, 122, 0.15);
        color: var(--clubs);
      }
      .badge-lock {
        background: rgba(212, 87, 74, 0.12);
        color: var(--hearts);
      }
      .player-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 1.25rem;
      }
      .ptab {
        flex: 1;
        padding: 9px;
        border-radius: 10px;
        border: 0.5px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
      }
      .ptab.active-p1 {
        background: rgba(123, 184, 240, 0.12);
        border-color: var(--p1);
        color: var(--p1);
        font-weight: 500;
      }
      .ptab.active-p2 {
        background: rgba(208, 128, 208, 0.12);
        border-color: var(--p2);
        color: var(--p2);
        font-weight: 500;
      }
      .q-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 0.75rem;
      }
      .q-item {
        background: var(--surface2);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .q-item-text {
        flex: 1;
        font-size: 13px;
        color: var(--text);
        line-height: 1.5;
      }
      .q-item-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        white-space: nowrap;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .badge-soft {
        background: rgba(109, 184, 122, 0.15);
        color: var(--clubs);
      }
      .badge-mid {
        background: rgba(212, 136, 74, 0.15);
        color: var(--diamonds);
      }
      .badge-hard {
        background: rgba(212, 87, 74, 0.15);
        color: var(--hearts);
      }
      .q-del {
        background: none;
        border: none;
        color: var(--text3);
        font-size: 15px;
        cursor: pointer;
        padding: 0 3px;
        line-height: 1;
        transition: color 0.15s;
      }
      .q-del:hover {
        color: var(--hearts);
      }
      .empty-hint {
        font-size: 12px;
        color: var(--text3);
        text-align: center;
        padding: 1rem 0;
        font-style: italic;
      }
      .add-q-form {
        background: var(--surface2);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-top: 0.75rem;
      }
      .intensity-row {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .int-btn {
        flex: 1;
        padding: 7px;
        border-radius: 8px;
        border: 0.5px solid var(--border2);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .int-btn:hover {
        background: var(--surface3);
      }
      .int-btn.sel-soft {
        background: rgba(109, 184, 122, 0.15);
        border-color: var(--clubs);
        color: var(--clubs);
      }
      .int-btn.sel-mid {
        background: rgba(212, 136, 74, 0.15);
        border-color: var(--diamonds);
        color: var(--diamonds);
      }
      .int-btn.sel-hard {
        background: rgba(212, 87, 74, 0.15);
        border-color: var(--hearts);
        color: var(--hearts);
      }
      .add-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .legend-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1.25rem;
      }
      .legend-item {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 11px 13px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .legend-sym {
        font-size: 18px;
        line-height: 1;
        margin-top: 1px;
      }
      .legend-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 1px;
      }
      .legend-desc {
        font-size: 11px;
        color: var(--text3);
      }
      .legend-item.s .legend-sym {
        color: var(--spades);
      }
      .legend-item.h .legend-sym {
        color: var(--hearts);
      }
      .legend-item.d .legend-sym {
        color: var(--diamonds);
      }
      .legend-item.c .legend-sym {
        color: var(--clubs);
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
      }
      .top-bar-title {
        font-family: "Playfair Display", serif;
        font-size: 15px;
        color: var(--gold);
        font-style: italic;
      }
      .stats {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .stat {
        text-align: center;
      }
      .stat-n {
        font-size: 17px;
        font-weight: 500;
        color: var(--text);
        line-height: 1;
      }
      .stat-l {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .stat-sep {
        width: 0.5px;
        height: 26px;
        background: var(--border2);
      }
      .turn-label {
        text-align: center;
        font-size: 13px;
        color: var(--text3);
        margin-bottom: 1.25rem;
      }
      .turn-name {
        font-weight: 500;
        color: var(--text);
      }
      .card-area {
        display: flex;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .card {
        width: 150px;
        height: 210px;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.15s;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 12px;
        user-select: none;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card:active {
        transform: scale(0.98);
      }
      .card-back {
        background: var(--surface);
        border: 0.5px solid var(--border2);
        align-items: center;
        justify-content: center;
      }
      .card-back-inner {
        width: 110px;
        height: 165px;
        border-radius: 8px;
        border: 0.5px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: center;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 4px,
          rgba(201, 168, 76, 0.04) 4px,
          rgba(201, 168, 76, 0.04) 8px
        );
      }
      .card-back-sym {
        font-size: 34px;
        opacity: 0.25;
      }
      .card-face {
        border: 0.5px solid rgba(255, 255, 255, 0.1);
      }
      .card-face.spades {
        background: #1c1e22;
      }
      .card-face.hearts {
        background: #1e1616;
      }
      .card-face.diamonds {
        background: #1e1810;
      }
      .card-face.clubs {
        background: #121e14;
      }
      .card-corner-top {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.1;
      }
      .card-corner-bot {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.1;
        transform: rotate(180deg);
        margin-top: auto;
      }
      .card-val {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        font-weight: 600;
      }
      .card-sym-s {
        font-size: 13px;
      }
      .card-center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-sym-big {
        font-size: 46px;
        line-height: 1;
      }
      .card-face.spades .card-val,
      .card-face.spades .card-sym-s,
      .card-face.spades .card-sym-big {
        color: var(--spades);
      }
      .card-face.hearts .card-val,
      .card-face.hearts .card-sym-s,
      .card-face.hearts .card-sym-big {
        color: var(--hearts);
      }
      .card-face.diamonds .card-val,
      .card-face.diamonds .card-sym-s,
      .card-face.diamonds .card-sym-big {
        color: var(--diamonds);
      }
      .card-face.clubs .card-val,
      .card-face.clubs .card-sym-s,
      .card-face.clubs .card-sym-big {
        color: var(--clubs);
      }
      .draw-hint {
        text-align: center;
        font-size: 12px;
        color: var(--text3);
        margin-top: -0.5rem;
        margin-bottom: 1rem;
        letter-spacing: 0.05em;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      .q-box {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1.25rem 1rem;
        margin-bottom: 1rem;
        animation: fadeIn 0.35s ease;
      }
      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .q-cat {
        font-size: 11px;
        color: var(--text3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .q-dots {
        display: flex;
        gap: 4px;
      }
      .q-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border2);
      }
      .q-dot.on {
        background: var(--gold);
      }
      .q-dot.fire {
        background: var(--hearts);
      }
      .q-source {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 8px;
        display: inline-block;
      }
      .src-p1 {
        background: rgba(123, 184, 240, 0.12);
        color: var(--p1);
      }
      .src-p2 {
        background: rgba(208, 128, 208, 0.12);
        color: var(--p2);
      }
      .mechanic-tag {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 8px;
      }
      .tag-j {
        background: rgba(55, 138, 221, 0.15);
        color: #7bb8f0;
        border: 0.5px solid rgba(55, 138, 221, 0.25);
      }
      .tag-q {
        background: rgba(180, 70, 180, 0.15);
        color: #d080d0;
        border: 0.5px solid rgba(180, 70, 180, 0.25);
      }
      .tag-k {
        background: rgba(201, 168, 76, 0.15);
        color: var(--gold);
        border: 0.5px solid rgba(201, 168, 76, 0.25);
      }
      .tag-a {
        background: rgba(109, 184, 122, 0.15);
        color: var(--clubs);
        border: 0.5px solid rgba(109, 184, 122, 0.25);
      }
      .mechanic-desc {
        font-size: 12px;
        color: var(--text3);
        margin-bottom: 10px;
        font-style: italic;
        line-height: 1.5;
      }
      .q-text {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        color: var(--text);
        line-height: 1.6;
      }
      .ace-input-box {
        margin-top: 10px;
      }
      .ace-input-box textarea {
        font-family: "Playfair Display", serif;
        font-size: 15px;
        min-height: 70px;
      }
      .ace-confirm {
        width: 100%;
        margin-top: 8px;
        padding: 10px;
      }
      .action-row {
        display: flex;
        gap: 8px;
        margin-bottom: 1rem;
      }
      .btn-next {
        flex: 1;
        padding: 12px;
      }
      .hist-toggle {
        width: 100%;
        background: none;
        border: none;
        color: var(--text3);
        font-size: 12px;
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        padding: 6px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        transition: color 0.15s;
        text-align: center;
      }
      .hist-toggle:hover {
        color: var(--text2);
      }
      .hist-panel {
        margin-top: 0.75rem;
        border-top: 0.5px solid var(--border);
        padding-top: 0.75rem;
      }
      .hist-item {
        display: flex;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 0.5px solid var(--border);
        align-items: flex-start;
      }
      .hist-item:last-child {
        border-bottom: none;
      }
      .hist-tag {
        font-family: "Playfair Display", serif;
        font-size: 13px;
        min-width: 34px;
        color: var(--gold2);
      }
      .hist-q {
        font-size: 12px;
        color: var(--text3);
        line-height: 1.4;
        flex: 1;
      }
      .end-screen {
        text-align: center;
        padding: 2rem 0;
        animation: fadeIn 0.5s ease;
      }
      .end-screen h2 {
        font-family: "Playfair Display", serif;
        font-size: 26px;
        color: var(--gold);
        margin-bottom: 0.5rem;
      }
      .end-screen p {
        font-size: 14px;
        color: var(--text3);
        margin-bottom: 1.5rem;
      }
      .summary-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 1.5rem;
      }
      .summary-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
      }
      .summary-n {
        font-size: 22px;
        font-weight: 500;
        color: var(--text);
        line-height: 1;
      }
      .summary-l {
        font-size: 11px;
        color: var(--text3);
        margin-top: 3px;
      }
      .loading {
        text-align: center;
        padding: 3rem 0;
        color: var(--text3);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"><div class="loading">Cargando...</div></div>
    <script>
      const MAZOS_CONFIG = [
        {
          id: "base",
          icon: "🃏",
          nombre: "Base",
          desc: "El mazo original. Para conocerse de verdad.",
          free: true,
        },
        {
          id: "primera-cita",
          icon: "✨",
          nombre: "Primera cita",
          desc: "Para conocerse sin que parezca interrogatorio.",
          free: true,
        },
        {
          id: "compromiso",
          icon: "💍",
          nombre: "Compromiso",
          desc: "Las preguntas que toda pareja seria debe hacerse.",
          free: true,
        },
        {
          id: "amigos",
          icon: "🤝",
          nombre: "Amigos",
          desc: "Para conocerse más allá de lo superficial.",
          free: true,
        },

      }
      function resetGame() {
        S.phase = "names";
        S.customQ = [[], []];
        S.newQText = "";
        S.usedQuestions = new Set();
        render();
      }
      function renderEnd() {
        return `<div class="end-screen"><div class="logo"><div class="logo-suit">♠ ♥ ♦ ♣</div><h1>La baraja del <em>abismo</em></h1></div><h2>¡Mazo agotado!</h2><p>${S.history.length} preguntas en una sola noche.</p><div class="summary-row"><div class="summary-card"><div class="summary-n">${S.history.length}</div><div class="summary-l">Respondidas</div></div><div class="summary-card"><div class="summary-n">${S.customQ[0].length + S.customQ[1].length}</div><div class="summary-l">Personalizadas</div></div></div><button class="btn btn-primary" style="width:100%;padding:13px;margin-bottom:0.75rem;" onclick="startGame()">Jugar de nuevo</button><button class="btn" style="width:100%;padding:11px;" onclick="resetGame()">Nuevo juego desde cero</button></div>`;
      }
      render();
    </script>
  </body>
</html>
